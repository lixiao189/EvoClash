[package]
name = "evoclash"
description = "EvoClash game client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
evoclash-game = { workspace = true, features = ["client"] }
# Hand-picked rather than the "2d"/"ui" bundles, which also pull in gamepads, picking, scenes,
# animation, gizmos, UI widgets, sysinfo and Wayland: compile time and wasm size this game never uses.
bevy = { workspace = true, features = [
  "bevy_asset",
  "bevy_window",
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  # Sprites shipped as files (assets/lpc/).
  "png",
  "webgl2",
  "web",
  # Only so the client still builds natively on Linux (CI clippy/tests); winit needs a backend.
  "x11",
] }
lightyear = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
ehttp.workspace = true
base64.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Clipboard", "History", "Location", "Navigator", "Storage", "UrlSearchParams", "Window"] }

[dev-dependencies]
# Reads and writes PNGs in the LPC bake step and sprite previews (already used by Bevy).
png = "0.18"

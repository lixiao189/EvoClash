[package]
name = "evoclash"
description = "EvoClash game client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
evoclash-game = { workspace = true, features = ["client"] }
bevy = { workspace = true, features = ["2d", "ui", "web"] }
lightyear = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
ehttp.workspace = true
base64.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "UrlSearchParams", "Window"] }

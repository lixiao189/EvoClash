[package]
name = "evoclash-matchmaker"
description = "Stateless-friendly matchmaker: queues players, allocates match servers, issues netcode connect tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
evoclash-game.workspace = true
lightyear.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
tower-http.workspace = true
# `--lan` serves the page over HTTPS. Browsers refuse WebTransport on http://<lan-ip>.
# `ring` matches the WebTransport stack; the default rustls provider would pull aws-lc.
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ttf-parser is pulled in by Bevy's text stack; no maintained drop-in replacement upstream yet.
  { id = "RUSTSEC-2026-0192", reason = "transitive via bevy_text, waiting on upstream" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
]

[bans]
# Bevy's dependency tree always carries a few duplicate versions; flag them without failing CI.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

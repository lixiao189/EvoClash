name: Deploy

# Ships the single-node k3s box and the Sealos namespace after CI passes on main. Nothing is built
# here: the image is the one CI's `image` job smoke-tested and uploaded (tagged by content, so a
# push that changes no binaries leaves the running pods alone). Manual runs deploy the latest
# green main CI run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      # Download the image artifact from the CI run.
      actions: read
    steps:
      - name: Pick the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            read -r RUN_ID HEAD_SHA < <(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
          fi
          echo "CI run ${RUN_ID} at ${HEAD_SHA}"
          echo "id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      # The chart from the same commit as the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image
          path: image
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Pack image and chart, ship over ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          host=${DEPLOY_HOST:-179.255.113.5}
          port=${DEPLOY_PORT:-1145}
          tag=$(cat image/tag)
          if [[ -z "${DEPLOY_SSH_KEY:-}" || -z "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set on environment production"
            exit 1
          fi
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_PORT must be numeric"
            exit 1
          fi
          if [[ ! "$tag" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::image tag '$tag' is not 12 hex chars"
            exit 1
          fi
          mkdir bundle
          gunzip -c image/image.tar.gz > bundle/image.tar
          cp -a deploy/helm/evoclash bundle/chart
          tar -czf bundle.tgz -C bundle image.tar chart
          key=$(mktemp)
          known=$(mktemp)
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known"
          ssh -p "$port" -i "$key" \
            -o "UserKnownHostsFile=${known}" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "root@${host}" \
            "deploy ${tag}" < bundle.tgz

  # Sealos (gzg.sealos.run): the same image, pushed to ghcr so the cluster can pull it, then helm
  # with deploy/sealos/values-sealos.yaml. See deploy/sealos/README.md.
  sealos:
    name: Deploy (Sealos)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sealos
    permissions:
      contents: read
      actions: read
      # Push the image to ghcr.
      packages: write
    steps:
      - name: Pick the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            read -r RUN_ID HEAD_SHA < <(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
          fi
          echo "CI run ${RUN_ID} at ${HEAD_SHA}"
          echo "id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image
          path: image
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Push the image to ghcr
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          tag=$(cat image/tag)
          if [[ ! "$tag" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::image tag '$tag' is not 12 hex chars"
            exit 1
          fi
          repo="ghcr.io/${OWNER,,}/evoclash-server"
          gunzip -c image/image.tar.gz | docker load
          docker tag "evoclash-server:${tag}" "${repo}:${tag}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "${repo}:${tag}"
          docker logout ghcr.io
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Helm upgrade
        env:
          SEALOS_KUBECONFIG: ${{ secrets.SEALOS_KUBECONFIG }}
          SEALOS_NAMESPACE: ${{ vars.SEALOS_NAMESPACE }}
          SEALOS_PUBLIC_HOST: ${{ vars.SEALOS_PUBLIC_HOST }}
          SEALOS_HOST: ${{ vars.SEALOS_HOST }}
          REPO: ${{ steps.image.outputs.repo }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${SEALOS_KUBECONFIG:-}" ]]; then
            echo "::error::SEALOS_KUBECONFIG must be set on environment sealos"
            exit 1
          fi
          ns=${SEALOS_NAMESPACE:-ns-80h1uphq}
          KUBECONFIG=$(mktemp)
          export KUBECONFIG
          trap 'rm -f "$KUBECONFIG"' EXIT
          chmod 600 "$KUBECONFIG"
          printf '%s\n' "$SEALOS_KUBECONFIG" > "$KUBECONFIG"
          extra=()
          if [[ -n "${SEALOS_PUBLIC_HOST:-}" ]]; then
            extra+=(--set "single.publicHost=${SEALOS_PUBLIC_HOST}")
          fi
          if [[ -n "${SEALOS_HOST:-}" ]]; then
            extra+=(--set "single.nodePort.ingress.host=${SEALOS_HOST}"
                    --set "single.nodePort.ingress.tls[0].hosts[0]=${SEALOS_HOST}"
                    --set "single.nodePort.ingress.tls[0].secretName=wildcard-cert")
          fi
          helm upgrade --install evoclash deploy/helm/evoclash \
            --namespace "$ns" \
            -f deploy/sealos/values-sealos.yaml \
            --set "image.repository=${REPO}" \
            --set "image.tag=${TAG}" \
            "${extra[@]}" \
            --wait --timeout 10m
          kubectl -n "$ns" get deploy,svc,ingress -l app.kubernetes.io/instance=evoclash

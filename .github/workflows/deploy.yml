name: Deploy

# Ships the single-node k3s box after CI passes on main. Nothing is built here: the image is the
# one CI's `image` job smoke-tested and uploaded (tagged by content, so a push that changes no
# binaries leaves the running pod alone). Manual runs deploy the latest green main CI run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      # Download the image artifact from the CI run.
      actions: read
    steps:
      - name: Pick the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            read -r RUN_ID HEAD_SHA < <(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
          fi
          echo "CI run ${RUN_ID} at ${HEAD_SHA}"
          echo "id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
      # The chart from the same commit as the image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image
          path: image
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Pack image and chart, ship over ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          host=${DEPLOY_HOST:-179.255.113.5}
          port=${DEPLOY_PORT:-1145}
          tag=$(cat image/tag)
          if [[ -z "${DEPLOY_SSH_KEY:-}" || -z "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set on environment production"
            exit 1
          fi
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_PORT must be numeric"
            exit 1
          fi
          if [[ ! "$tag" =~ ^[0-9a-f]{12}$ ]]; then
            echo "::error::image tag '$tag' is not 12 hex chars"
            exit 1
          fi
          mkdir bundle
          gunzip -c image/image.tar.gz > bundle/image.tar
          cp -a deploy/helm/evoclash bundle/chart
          tar -czf bundle.tgz -C bundle image.tar chart
          key=$(mktemp)
          known=$(mktemp)
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known"
          ssh -p "$port" -i "$key" \
            -o "UserKnownHostsFile=${known}" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "root@${host}" \
            "deploy ${tag}" < bundle.tgz

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes Bevy's target dir huge and slows cache save/restore; CI doesn't need it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Native libraries the client (winit on X11) links against on Linux; the client only
  # runs in browsers, but it still compiles natively for clippy and its tests.
  LINUX_DEPS: pkg-config libxkbcommon-dev

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a space-separated list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The build players actually run.
      - run: cargo clippy -p evoclash --target wasm32-unknown-unknown --locked -- -D warnings

  # One runner is enough: players only run the wasm client and servers only run in Linux images.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_DEPS is a space-separated list
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Helm is preinstalled on GitHub's Ubuntu runners.
      - run: helm lint --strict deploy/helm/evoclash
      - run: helm template evoclash deploy/helm/evoclash > /dev/null

  # Builds the release Docker image (without pushing) and runs it, so a broken Dockerfile or a
  # binary that can't start on the distroless base shows up in the PR, not at release time.
  # On main the smoke-tested image is also uploaded; deploy.yml ships exactly that image.
  image:
    name: Server image
    # Same glibc baseline as the release binaries the real image packages.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: trunk
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `trunk build --release` uses the `wasm` profile (index.html
      # `data-cargo-profile-release`). That profile used to be named `web`, which is
      # also trunk's dist dir, so trunk deleted the host build artifacts before
      # rust-cache saved. An exact hit is never rewritten ("Cache up-to-date"), and
      # the key does not cover the virtual manifest, so renaming the profile did not
      # bust it: every image run still compiles the wasm dependencies from scratch.
      # Keep the hot dev-profile cache above for the server binaries. Cache the wasm
      # profile in its own target dir, and only save it from main, same as rust-cache.
      - name: Restore wasm profile cache
        id: wasm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target-wasm
          key: wasm-profile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'crates/client/Cargo.toml', 'crates/game/Cargo.toml', 'crates/server/Cargo.toml', 'crates/matchmaker/Cargo.toml') }}
          restore-keys: |
            wasm-profile-${{ runner.os }}-${{ runner.arch }}-
      # Release profile, so the image main uploads is the one production runs. PRs build the
      # same profile and reuse the cache main saves.
      - run: cargo build --release --locked -p evoclash-server -p evoclash-matchmaker
      - run: trunk build --release --locked
        working-directory: crates/client
        env:
          # Absolute: a relative target dir would be resolved from crates/client.
          # Trunk's dist stays ../../target/web (Trunk.toml), outside this directory.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-wasm
      - name: Save wasm profile cache
        if: github.ref == 'refs/heads/main' && steps.wasm-cache.outputs.cache-hit != 'true'
        # A concurrent main push can lose the save race once the key exists. The build
        # already succeeded; failing the job on that would not be a failed check.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target-wasm
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}
      - name: Stage binaries and the browser client like release.yml does
        run: |
          mkdir -p dist/amd64
          cp target/release/evoclash-server target/release/evoclash-matchmaker dist/amd64/
          cp -r target/web dist/amd64/web
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: evoclash-server:ci
      - name: Smoke test (serves the browser client; launches a match that heartbeats back)
        run: |
          # The image runs as nonroot and has no shell, so match logs go to a host directory.
          mkdir -m 777 match-logs
          docker run -d --name evoclash --network host -v "$PWD/match-logs:/logs" \
            evoclash-server:ci --listen 127.0.0.1:8080 --log-dir /logs --warm-matches 1
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/play/ | grep -q 'evoclash' || { sleep 1; continue; }
            if curl -fsS http://127.0.0.1:8080/v1/matches \
              | jq -e '[.matches[] | select(.healthy and .tick_us > 0)] | length > 0'; then
              exit 0
            fi
            sleep 1
          done
          docker logs evoclash
          cat match-logs/*.log || true
          exit 1
      # Tagged by content, not commit: a push that leaves the binaries, client and Dockerfile
      # unchanged redeploys the same tag, so helm leaves the running pod (and its matches) alone.
      - name: Save the image for deploy.yml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag=$( (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum; sha256sum ../Dockerfile) | sha256sum | cut -c1-12)
          docker tag evoclash-server:ci "evoclash-server:${tag}"
          mkdir image
          echo "$tag" > image/tag
          docker save "evoclash-server:${tag}" | gzip -1 > image/image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: image
          retention-days: 7
          if-no-files-found: error

  # Single required status for branch protection, so jobs can change without editing settings.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, deny, helm, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

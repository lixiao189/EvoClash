version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bevy and lightyear move in lockstep and need manual migration; keep them out of the batch.
      cargo-minor:
        update-types: [minor, patch]
        exclude-patterns: ["bevy*", "lightyear*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

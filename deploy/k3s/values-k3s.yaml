# 单机 k3s（无 Agones、无仓库）。镜像由 evoclash-deploy.sh 直接 import 进 containerd。
# `docker save evoclash-server:<tag>` 的 RepoTag 没有仓库名；k3s ctr import 会规范化成
# docker.io/library/evoclash-server:<tag>。脚本用 --set 写成这个引用，pullPolicy 保持 Never。
image:
  repository: evoclash-server
  pullPolicy: Never

single:
  enabled: true
  publicHost: 179.255.113.5
  ports: "37000-37063"
  maxMatches: 4
  warmMatches: 1
  httpsPort: 38443

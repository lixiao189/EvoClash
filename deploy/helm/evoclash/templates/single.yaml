{{- /* hostNetwork: false renders single-nodeport.yaml instead. */ -}}
{{- if and (dig "enabled" false .Values.single) (dig "hostNetwork" true .Values.single) }}
{{- $single := .Values.single }}
{{- if not $single.publicHost }}
{{- fail "single.publicHost is required when single.enabled (IP players' WebTransport connects to)" }}
{{- end }}
{{- if not (contains "-" ($single.ports | toString)) }}
{{- fail "single.ports must look like 37000-37063" }}
{{- end }}
{{- $name := include "evoclash.fullname" . }}
{{- $selector := include "evoclash.selectorLabels" (dict "root" . "component" "single") }}
# Cloudflare authenticated origin pull CA.
# https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# CN=origin-pull.cloudflare.net, notAfter 2029-11-01.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-nginx
  labels:
    {{- include "evoclash.labels" . | nindent 4 }}
    app.kubernetes.io/component: single
data:
  proxy.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header Connection "";
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;
    events {
        worker_connections 512;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        sendfile on;
        server_tokens off;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types application/javascript text/javascript application/wasm text/css application/json image/svg+xml;
        server {
            listen {{ $single.httpsPort }} ssl;
            server_name _;
            ssl_certificate /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            {{ if $single.tls.originPull }}
            ssl_client_certificate /etc/nginx/evoclash/origin-pull-ca.pem;
            ssl_verify_client on;
            {{ end }}
            location = / {
                include /etc/nginx/evoclash/proxy.conf;
                proxy_pass http://127.0.0.1:8080;
            }
            location = /healthz {
                include /etc/nginx/evoclash/proxy.conf;
                proxy_pass http://127.0.0.1:8080;
            }
            location = /v1/join {
                include /etc/nginx/evoclash/proxy.conf;
                proxy_pass http://127.0.0.1:8080;
            }
            location = /v1/rooms {
                include /etc/nginx/evoclash/proxy.conf;
                proxy_pass http://127.0.0.1:8080;
            }
            location = /v1/rejoin {
                include /etc/nginx/evoclash/proxy.conf;
                proxy_pass http://127.0.0.1:8080;
            }
            location /play {
                include /etc/nginx/evoclash/proxy.conf;
                proxy_pass http://127.0.0.1:8080;
            }
            location / {
                return 404;
            }
        }
    }

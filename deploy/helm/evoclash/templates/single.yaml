apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "evoclash.labels" . | nindent 4 }}
    app.kubernetes.io/component: single
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- $selector | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "evoclash.commonLabels" . | nindent 8 }}
        {{- $selector | nindent 8 }}
      annotations:
        # Roll the pod when nginx's listen port, origin pull, or image changes. The
        # ConfigMap itself is not mounted in a way that restarts the process.
        checksum/nginx: {{ printf "%v|%v|%s|%s" $single.httpsPort $single.tls.originPull $single.tls.secretName $single.nginx.image | sha256sum | quote }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: {{ $single.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        # emptyDir ends up group-writable by nginx's gid. Both containers get it as a
        # supplemental group, so the matchmaker (uid 65532) can write /tmp too.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: matchmaker
          image: {{ include "evoclash.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/evoclash-matchmaker"]
          args:
            - --listen
            - 127.0.0.1:8080
            - --public-host
            - {{ $single.publicHost | quote }}
            - --ports
            - {{ $single.ports | quote }}
            - --max-matches
            - {{ $single.maxMatches | quote }}
            - --warm-matches
            - {{ $single.warmMatches | quote }}
            - --log-dir
            - /tmp/logs
            {{- range $single.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "evoclash.keyEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              host: 127.0.0.1
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              host: 127.0.0.1
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $single.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: matchmaker-tmp, mountPath: /tmp }
        - name: https
          image: {{ $single.nginx.image }}
          imagePullPolicy: {{ $single.nginx.pullPolicy }}
          # Skip the image entrypoint: it rewrites nginx.conf, which is a read-only mount.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /tmp/client_temp /tmp/proxy_temp /tmp/fastcgi_temp /tmp/uwsgi_temp /tmp/scgi_temp
              exec /usr/sbin/nginx -g 'daemon off;' -c /etc/nginx/evoclash/nginx.conf
          ports:
            - { name: https, containerPort: {{ $single.httpsPort }}, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: https, host: 127.0.0.1 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: https, host: 127.0.0.1 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $single.nginx.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/evoclash, readOnly: true }
            - { name: origin-tls, mountPath: /etc/nginx/tls, readOnly: true }
            - { name: nginx-tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: matchmaker-tmp, emptyDir: {} }
        - { name: nginx-tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - name: nginx-config
          configMap:
            name: {{ $name }}-nginx
        - name: origin-tls
          secret:
            secretName: {{ $single.tls.secretName }}
            defaultMode: 0444
{{- end }}

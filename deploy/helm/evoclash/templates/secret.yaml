{{- if not .Values.netcodeKey.existingSecret }}
{{- $name := include "evoclash.secretName" . }}
{{- $key := .Values.netcodeKey.value }}
{{- if not $key }}
{{- /* Reuse the key from a previous install so upgrades don't invalidate tokens in flight. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data .Values.netcodeKey.secretKey) }}
{{- $key = index $existing.data .Values.netcodeKey.secretKey | b64dec }}
{{- else }}
{{- $key = sha256sum (printf "%s%s%s" (randAlphaNum 32) (randAlphaNum 32) now) }}
{{- end }}
{{- end }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" $key) }}
{{- fail "netcodeKey.value must be 64 hex characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "evoclash.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.netcodeKey.secretKey }}: {{ $key | b64enc }}
{{- end }}

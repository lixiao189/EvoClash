{{- /* single mode launches match servers in-process; no Agones Fleet. */ -}}
{{- if not (dig "enabled" false .Values.single) }}
{{- $srv := .Values.server }}
# One pod per match, each on its own dynamic host UDP port. Lifecycle (crates/server/src/agones.rs):
#   Ready      empty server, part of the warm buffer; the matchmaker may send players here
#   Allocated  the first player joined; Agones will not scale it down mid-match
#   Shutdown   the match ended; Agones deletes the pod and the Fleet starts a fresh one
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: {{ include "evoclash.fleet" . }}
  labels:
    {{- include "evoclash.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.fleet.replicas }}
  scheduling: {{ .Values.fleet.scheduling }}
  strategy:
    type: RollingUpdate
    # Rolling updates replace Ready servers; Allocated ones finish their match first.
    rollingUpdate:
      {{- toYaml .Values.fleet.rollingUpdate | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "evoclash.selectorLabels" (dict "root" . "component" "server") | nindent 8 }}
    spec:
      ports:
        - name: game
          containerPort: {{ $srv.containerPort }}
          protocol: UDP
          portPolicy: Dynamic
      health:
        {{- toYaml $srv.health | nindent 8 }}
      template:
        metadata:
          labels:
            {{- include "evoclash.commonLabels" . | nindent 12 }}
            {{- include "evoclash.selectorLabels" (dict "root" . "component" "server") | nindent 12 }}
          {{- with $srv.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          terminationGracePeriodSeconds: {{ $srv.terminationGracePeriodSeconds }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: evoclash-server
              image: {{ include "evoclash.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/evoclash-server"]
              args:
                - --agones
                - --port
                - {{ $srv.containerPort | quote }}
                - --matchmaker
                - http://{{ include "evoclash.heartbeat" . }}:8080
                - --max-players
                - {{ $srv.maxPlayers | quote }}
                - --bots
                - {{ $srv.bots | quote }}
                - --threads
                - {{ $srv.threads | quote }}
                {{- if not $srv.monsters }}
                - --no-monsters
                {{- end }}
                {{- range $srv.extraArgs }}
                - {{ . | quote }}
                {{- end }}
              env:
                {{- include "evoclash.keyEnv" . | nindent 16 }}
              resources:
                {{- toYaml $srv.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
          {{- with $srv.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $srv.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $srv.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- if .Values.fleet.autoscaler.enabled }}
---
# Keep empty Ready servers on standby so joins never wait for a pod to schedule.
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: {{ include "evoclash.fleet" . }}
  labels:
    {{- include "evoclash.labels" . | nindent 4 }}
spec:
  fleetName: {{ include "evoclash.fleet" . }}
  policy:
    type: Buffer
    buffer:
      bufferSize: {{ .Values.fleet.autoscaler.bufferSize }}
      minReplicas: {{ .Values.fleet.autoscaler.minReplicas }}
      maxReplicas: {{ .Values.fleet.autoscaler.maxReplicas }}
{{- end }}
{{- end }}

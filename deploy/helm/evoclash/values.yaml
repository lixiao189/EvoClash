fullnameOverride: ""


# Both components ship in one image (Dockerfile): /app/evoclash-matchmaker and /app/evoclash-server.
image:
  repository: ghcr.io/lixiao189/evoclash-server
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# 32-byte netcode key shared by the matchmaker and every match server (signs connect tokens).
netcodeKey:
  # Use an existing Secret instead of creating one.
  existingSecret: ""
  secretKey: key
  # 64 hex chars. Left empty, a random key is generated on install and kept across upgrades.
  value: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

matchmaker:
  # Stateless replicas; match servers heartbeat to all of them via the headless Service.
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  # Public entry point for clients: evoclash --matchmaker http://<address>:<port>
  service:
    type: LoadBalancer
    port: 80
    annotations: {}
    loadBalancerSourceRanges: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #  - host: play.example.com
    tls: []
  extraArgs: []
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

server:
  # Every room is fixed at 8 combatants (humans first, bots fill the rest); the server
  # ignores other values.
  maxPlayers: 8
  # Legacy fill target, kept for the server's compatibility flag: also fixed at 8.
  bots: 8
  monsters: true
  # ECS worker threads per match process; a match ticks in well under 1 ms of one core.
  threads: 1
  # UDP port of pod ordinal 0. Pod N binds basePort + N on its node's network (hostNetwork), so
  # two matches on one node never share a port and clients reach a match by node IP and port.
  # Open basePort .. basePort + replicas - 1 to players (WebTransport runs over UDP).
  basePort: 7000
  # IP written into connect tokens. Empty = the pod's status.hostIP (the node it runs on), which
  # is right whenever nodes have public IPs. Set it when the node's public address differs from
  # the internal one (NAT, a cloud load balancer in front): every match on every node then
  # advertises this address. Not a hostname, and it must reach basePort+ordinal on that node.
  publicHost: ""
  # Static size when autoscaling is off.
  replicas: 4
  # SIGTERM drains (finish the match, then exit): one 8-minute match plus warmup and intermission.
  # A pod is a long-lived room that loops matches, so this only bounds a drain, not a restart.
  terminationGracePeriodSeconds: 540
  # Pods share the node's network, so no single probe port fits every pod: the probe runs the
  # server binary against a health file the simulation refreshes while it ticks (--healthcheck).
  livenessProbe:
    exec:
      command: ["/app/evoclash-server", "--healthcheck"]
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  # Buffer autoscaling, done by the matchmaker through the StatefulSet's scale subresource
  # (crates/matchmaker/src/scaler/): replicas = matches with players + bufferSize, clamped to
  # min..max. Scale-down only removes empty, highest-ordinal pods; a player on the top pod holds
  # it until their match ends. An idle pod is a warm room between matches, so joins never wait
  # for a pod start.
  autoscaler:
    enabled: true
    bufferSize: 3
    minReplicas: 3
    maxReplicas: 300
  extraArgs: []
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# One small node, no match StatefulSet. The matchmaker launches match servers as child
# processes and nginx terminates HTTPS on the host network. Off by default: the cluster chart
# (matchmaker Deployment + match StatefulSet) is what runs when this is false.
# Browsers come in through Cloudflare (proxied HTTPS). WebTransport is UDP straight to publicHost;
# Cloudflare cannot proxy it. See deploy/k3s/.
single:
  enabled: false
  # IP written into connect tokens. Required when enabled. Not a hostname.
  publicHost: ""
  # false: no hostNetwork and no nginx sidecar, for namespaces that forbid host networking
  # (Sealos). The matchmaker listens on the pod network behind an Ingress (`nodePort.ingress`);
  # match UDP goes through one NodePort Service whose nodePorts equal `ports`, so the advertised
  # port is the one players reach. `ports` must then sit in 30000-32767. See deploy/sealos/.
  hostNetwork: true
  # Inclusive host UDP range the match servers bind. Open it to players.
  ports: "37000-37063"
  maxMatches: 4
  # Empty matches kept running so a join never waits on a process start.
  warmMatches: 1
  # Pod grace period. Child match processes die with the container; raise this to let a match finish.
  terminationGracePeriodSeconds: 30
  # Host port nginx binds (hostNetwork). Above 1024 so the unprivileged image can listen.
  httpsPort: 38443
  extraArgs: []
  # The limit covers the matchmaker and the match servers it spawns inside this container.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 768Mi }
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    # Not the game image: this one is pulled. The game image often uses pullPolicy Never.
    pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  tls:
    # Created out of band (Cloudflare origin certificate):
    #   kubectl -n <ns> create secret tls evoclash-origin-tls --cert=origin.pem --key=origin.key
    secretName: evoclash-origin-tls
    # Require Cloudflare's authenticated origin pull client certificate.
    originPull: true
  # Used only when hostNetwork is false.
  nodePort:
    # Peers (besides loopback) whose X-Real-IP names the player, for the per-IP room rate
    # limit: the ingress gateway's source range. Comma-separated CIDRs; empty trusts none.
    trustedProxies: ""
    ingress:
      className: ""
      annotations: {}
      # Required: the public HTTPS host, e.g. evoclash-xxxx.gzg.sealos.run.
      host: ""
      # Empty: the ingress controller's default certificate.
      tls: []

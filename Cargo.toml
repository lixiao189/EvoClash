[workspace]
resolver = "3"
members = ["crates/game", "crates/server", "crates/client", "crates/matchmaker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
evoclash-game = { path = "crates/game" }
# The headless server only needs the ECS/app core; the client crate adds rendering features.
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_log",
  "bevy_state",
  "bevy_color",
  "bevy_curve",
  "serialize",
] }
lightyear = { version = "0.31", default-features = false, features = [
  "std",
  "netcode",
  # Browsers can't open raw UDP sockets; WebTransport (QUIC, still UDP underneath) keeps
  # unreliable, unordered delivery for game traffic.
  "webtransport",
  "input_native",
  "replication",
  "prediction",
  "interpolation",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
axum = "0.8"
# Serves the wasm client from the matchmaker, so the game and its API share one origin.
tower-http = { version = "0.7", features = ["fs"] }
ureq = { version = "3", features = ["json"] }
# SIGTERM (not just Ctrl-C) so orchestrators can drain match servers gracefully.
ctrlc = { version = "3.4", features = ["termination"] }
base64 = "0.22"
# Async HTTP that works from wasm (browser fetch).
ehttp = { version = "0.7", default-features = false }
hmac = "0.12"
sha2 = "0.10"

# Bevy systems routinely take many params and nested query types; these lints are noise there.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# Bevy is slow in debug builds; optimize dependencies but keep our own crates fast to compile.
[profile.dev]
opt-level = 1
# Line tables keep panic backtraces readable; full debug info made up most of target/.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Nobody steps through Bevy in a debugger; dropping its debug info shrinks target/ and links faster.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

# The browser client (`make web`): stripped and size-optimized, since players download it.
# Not named `web`: cargo keeps a profile's host build scripts and proc-macros in target/<profile>/,
# and target/web is trunk's dist dir, which trunk replaces on every build.
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true
